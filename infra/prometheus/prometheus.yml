global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: go_core
    metrics_path: /metrics
    static_configs:
      - targets: [go_core:8010]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: [loki:3100]

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: [promtail:9080]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: [rabbitmq:15692]
