workflow_id: openai-bazzite-endpoint-v1
mode: async_parallel
coordinator: distributed-coder-1
merger: result-merger
tasks:
  - task_id: OBE-001
    owner_agent: codex-main
    layer: collector
    files:
      - core/core/openai_bazzite_endpoint.py
      - core/scripts/collect_bazzite_openai_endpoint.py
    acceptance:
      - reads .codex and vscode-server env sources
      - derives direct openai endpoint manifest
      - emits discovery json artifact
  - task_id: OBE-002
    owner_agent: codex-openai-claude-sonnet-4-6
    layer: kernel_integration
    files:
      - core/core/openai_provider.py
      - core/core/provider_credentials.py
      - core/core/provider_inventory_service.py
      - core/scripts/orchestrator_daemon.py
    acceptance:
      - kernel can consume discovery artifact as fallback
      - runtime inventory uses discovered endpoint
      - discovery endpoint exposed over orchestrator http
  - task_id: OBE-003
    owner_agent: codex-openai-deepseek-v4-pro
    layer: routing_validation
    files:
      - core/core/openai_runtime_router.py
      - core/core/openai_model_registry.py
      - core/scripts/verify_openai_bridge.py
    acceptance:
      - non-routable models blocked
      - fully_routable_models built from probes
      - verify script reports discovered endpoint state
  - task_id: OBE-004
    owner_agent: local-llm-1
    layer: tests_docs
    files:
      - core/test/test_openai_bazzite_endpoint.py
      - core/test/test_provider_credentials.py
      - core/test/test_openai_provider.py
      - core/test/test_provider_inventory_service.py
    acceptance:
      - collector tests pass
      - fallback discovery tests pass
      - endpoint docs and manifest updated
