[mypy]
python_version = 3.11
files = core/core/kernel_api.py, core/core/kernel_protocol.py, core/core/kernel_module_manager.py, core/core/ports, core/adapters/runtime, core/adapters/event_bus, core/adapters/state, core/agents/base_agent.py
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
ignore_missing_imports = True
follow_imports = silent
pretty = True
show_error_codes = True
