version: 1
workflow:
  phases:
    - name: infra_preflight
      owner: infra_sandbox_agent
      parallel: false
      deliverables:
        - "unshare -Ur true passes"
        - "apply_patch create/update/delete passes"
        - "targeted test runner works"
      commands:
        - "go run ./go-core/cmd/orchestrator runtime-preflight"
    - name: retrieval_contract
      owner: lead_ai
      parallel: false
      deliverables:
        - "retrieval interface contract fixed"
    - name: implementation_parallel
      parallel: true
      tasks:
        - name: retrieval_impl
          owner: retrieval_refactor_agent
          files:
            - core/core/data_intelligence_retrieval_index.py
            - core/core/data_intelligence_module.py
            - core/test/test_data_intelligence_module.py
          deliverables:
            - "scoring extracted"
            - "graph-linking extracted"
            - "retrieval ranking tests added"
        - name: agent_integration
          owner: agent_integration_agent
          files:
            - core/agents/data_intelligence_agent.py
            - core/core/orchestrator.py
            - core/core/provider_budget_router.py
            - core/test/test_provider_budget_and_model_usage.py
          deliverables:
            - "agent registered"
            - "provider policy added"
            - "provider selection tests added"
    - name: final_verification
      owner: test_agent
      parallel: false
      deliverables:
        - "targeted tests pass"
        - "integration report emitted"
ownership:
  core/core/data_intelligence_retrieval_index.py: retrieval_refactor_agent
  core/core/data_intelligence_module.py: retrieval_refactor_agent
  core/agents/data_intelligence_agent.py: agent_integration_agent
  core/core/orchestrator.py: agent_integration_agent
  core/core/provider_budget_router.py: agent_integration_agent
  core/test/test_data_intelligence_module.py: retrieval_refactor_agent
  core/test/test_provider_budget_and_model_usage.py: agent_integration_agent
